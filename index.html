/* =========================
   GAME SYSTEM
========================= */

function openGame(index){
 stopEverything();

 currentGame=index;
 currentLevel=1;
 score=0;

 document.getElementById("homeScreen").style.display="none";
 document.getElementById("gameScreen").style.display="block";

 document.getElementById("level").textContent=currentLevel;
 document.getElementById("score").textContent=score;

 startTimer();
 loadGame();
}

function restartGame(){
 stopEverything();
 score=0;
 currentLevel=1;
 document.getElementById("level").textContent=1;
 document.getElementById("score").textContent=0;
 startTimer();
 loadGame();
}

function goHome(){
 stopEverything();
 document.getElementById("gameScreen").style.display="none";
 document.getElementById("homeScreen").style.display="block";
}

function stopEverything(){
 if(timerID) clearInterval(timerID);
 if(animationID) cancelAnimationFrame(animationID);
 timerID=null;
 animationID=null;
 document.onkeydown=null;
}

function startTimer(){
 if(timerID) clearInterval(timerID);

 time=Math.max(15,60-(currentLevel-1)*4);
 document.getElementById("timer").textContent=time;

 timerID=setInterval(()=>{
  time--;
  document.getElementById("timer").textContent=time;

  if(time<=0){
   clearInterval(timerID);
   timerID=null;
   document.getElementById("gameBox").innerHTML+=
    `<div class="message">⏰ Time's up!</div>
     <button class="gameButton" onclick="restartGame()">🔄 RESTART GAME</button>`;
  }
 },1000);
}

function updateScore(n){
 score+=n;
 document.getElementById("score").textContent=score;
}

function nextLevel(){
 if(currentLevel>=10){
  clearInterval(timerID);
  document.getElementById("gameBox").innerHTML=
   `<div class="big">🏆</div>
    <h2>LEVEL 10 COMPLETE!</h2>
    <div class="message">You finished all 10 levels!</div>
    <div class="message">Final Score: ${score}</div>
    <button class="gameButton" onclick="restartGame()">🔄 PLAY AGAIN</button>`;
  return;
 }

 currentLevel++;
 document.getElementById("level").textContent=currentLevel;
 startTimer();
 loadGame();
}

function racingCanvas(hard){

 document.getElementById("gameBox").innerHTML=
 `<h2>${games[currentGame][1]}</h2>
 <canvas id="race" width="700" height="420"></canvas>
 <div class="message">Use ← → or A / D</div>`;

 const c=document.getElementById("race");
 const x=c.getContext("2d");

 let player=330;
 let obstacles=[];
 let roadY=0;
 let alive=true;

 document.onkeydown=e=>{
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a") player-=20;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d") player+=20;
  player=Math.max(190,Math.min(470,player));
 };

 function loop(){
  if(!alive)return;

  roadY+=6;

  x.fillStyle="#101827";
  x.fillRect(0,0,700,420);

  x.fillStyle="#202b3d";
  x.fillRect(160,0,380,420);

  x.strokeStyle="#e5e7eb";
  x.setLineDash([30,25]);
  x.lineDashOffset=-roadY;
  x.lineWidth=5;
  x.beginPath();
  x.moveTo(350,0);
  x.lineTo(350,420);
  x.stroke();
  x.setLineDash([]);

  if(Math.random()<.035){
   obstacles.push({
    x:Math.random()*330+190,
    y:-50,
    speed:hard?7:5
   });
  }

  x.font="42px Arial";
  x.fillText("🏎️",player,365);

  obstacles.forEach(o=>{
   o.y+=o.speed;
   x.font="40px Arial";
   x.fillText("🚗",o.x,o.y);

   if(o.y>330&&o.y<390&&Math.abs(o.x-player)<45){
    alive=false;
    document.getElementById("gameBox").innerHTML+=
    `<div class="message">💥 CRASH!</div>
     <button class="gameButton" onclick="restartGame()">🔄 RESTART GAME</button>`;
   }

   if(o.y>420){
    updateScore(5);
   }
  });

  animationID=requestAnimationFrame(loop);
 }

 loop();
}

/* =========================
   MEMORY MATCH
========================= */

function memoryMatch(){

 let emojis=["🍎","🍌","🍇","🍉","🥝","🍒","🥭","🍓"];
 let cards=[...emojis,...emojis].sort(()=>Math.random()-.5);
 let opened=[];
 let matched=0;

 document.getElementById("gameBox").innerHTML=
 `<h2>🧠 Memory Match</h2>
 <div id="memoryGrid" class="memoryGrid"></div>`;

 let grid=document.getElementById("memoryGrid");

 cards.forEach((emoji,i)=>{
  let b=document.createElement("button");
  b.className="memoryCell";
  b.textContent="?";

  b.onclick=()=>{
   if(opened.length>=2||b.classList.contains("active"))return;

   b.textContent=emoji;
   b.classList.add("active");
   opened.push({b,emoji});

   if(opened.length===2){
    if(opened[0].emoji===opened[1].emoji){
     matched++;
     updateScore(10);
     opened=[];
     if(matched===emojis.length)setTimeout(nextLevel,500);
    }else{
     setTimeout(()=>{
      opened.forEach(a=>{
       a.b.textContent="?";
       a.b.classList.remove("active");
      });
      opened=[];
     },600);
    }
   }
  };

  grid.appendChild(b);
 });
}

 <div class="big">${correct}</div>
 <div>${colors.map(c=>
 `<button class="gameButton" onclick="chooseColor('${c}')">${c}</button>`
 ).join("")}</div>`;

 window.chooseColor=(c)=>{
  if(c===correct){
   updateScore(10);
   nextLevel();
  }
 };
}

/* =========================
   PATTERN MEMORY
========================= */

function patternMemory(){

 const size=16;
 const length=Math.min(3+currentLevel,10);
 let pattern=[];
 let player=[];
 let showing=true;

 for(let i=0;i<length;i++){
  let n=Math.floor(Math.random()*size);
  if(!pattern.includes(n))pattern.push(n);
  else i--;
 }

 document.getElementById("gameBox").innerHTML=
 `<h2>🟦 Pattern Memory</h2>
 <div class="message">Remember the blue squares!</div>
 <div id="patternGrid" class="memoryGrid"></div>`;

 const grid=document.getElementById("patternGrid");

 for(let i=0;i<size;i++){
  let b=document.createElement("button");
  b.className="memoryCell";
  b.id="p"+i;
  grid.appendChild(b);
 }

 pattern.forEach((n,i)=>{
  setTimeout(()=>{
   document.getElementById("p"+n).classList.add("active");

   setTimeout(()=>{
    document.getElementById("p"+n).classList.remove("active");
   },350);

  },i*450);
 });

 setTimeout(()=>{
  showing=false;

  document.getElementById("gameBox").insertAdjacentHTML(
   "afterbegin",
   `<div class="message">The pattern is hidden. Now reproduce it!</div>`
  );

  document.querySelectorAll("#patternGrid button").forEach((b,i)=>{
   b.onclick=()=>{
    if(showing)return;

    if(player.includes(i))return;

    player.push(i);
    b.classList.add("active");

    if(player.length===pattern.length){

     let correct=player.every((v,j)=>v===pattern[j]);

     if(correct){
      updateScore(25);
      setTimeout(nextLevel,600);
     }else{
      document.getElementById("gameBox").insertAdjacentHTML(
       "beforeend",
       `<div class="message">❌ Wrong pattern!</div>
        <button class="gameButton" onclick="restartGame()">🔄 RESTART GAME</button>`
      );
     }
    }
   };
  });
 },length*450+500);
}

   SNAKE
========================= */

function snake(){

 document.getElementById("gameBox").innerHTML=
 `<h2>🐍 Snake</h2>
 <canvas id="snakeCanvas" width="400" height="400"></canvas>
 <div class="message">Use arrow keys.</div>`;

 const c=document.getElementById("snakeCanvas");
 const x=c.getContext("2d");

 let snakeBody=[{x:10,y:10}];
 let food={x:15,y:15};
 let dx=1,dy=0;
 let alive=true;

 document.onkeydown=e=>{
  if(e.key==="ArrowUp"&&dy!==1){dx=0;dy=-1}
  if(e.key==="ArrowDown"&&dy!==-1){dx=0;dy=1}
  if(e.key==="ArrowLeft"&&dx!==1){dx=-1;dy=0}
  if(e.key==="ArrowRight"&&dx!==-1){dx=1;dy=0}
 };

 let last=0;

 function loop(t){
  if(!alive)return;

  if(t-last>100){
   last=t;

   let head={
    x:snakeBody[0].x+dx,
    y:snakeBody[0].y+dy
   };

   if(head.x<0||head.y<0||head.x>=20||head.y>=20){
    alive=false;
    document.getElementById("gameBox").innerHTML+=
    `<div class="message">💥 GAME OVER</div>
     <button class="gameButton" onclick="restartGame()">🔄 RESTART GAME</button>`;
    return;
   }

   snakeBody.unshift(head);

   if(head.x===food.x&&head.y===food.y){
    updateScore(10);
    food={
     x:Math.floor(Math.random()*20),
     y:Math.floor(Math.random()*20)
    };
   }else snakeBody.pop();

   x.clearRect(0,0,400,400);

   x.fillStyle="#22c55e";
   snakeBody.forEach(s=>x.fillRect(s.x*20,s.y*20,18,18));

   x.fillStyle="#ef4444";
   x.fillRect(food.x*20,food.y*20,18,18);
  }

  animationID=requestAnimationFrame(loop);
 }

 animationID=requestAnimationFrame(loop);
}

/* =========================
   BREAKOUT
========================= */

function breakout(){

 document.getElementById("gameBox").innerHTML=
 `<h2>🧱 Breakout</h2>
 <canvas id="breakCanvas" width="600" height="400"></canvas>
 <div class="message">Use ← →</div>`;

 const c=document.getElementById("breakCanvas");
 const x=c.getContext("2d");

 let paddle=250;
 let ball={x:300,y:300,dx:4,dy:-4};
 let blocks=[];

 for(let r=0;r<3+currentLevel/3;r++){
  for(let col=0;col<7;col++){
   blocks.push({
    x:20+col*80,
    y:30+r*30,
    alive:true
   });
  }
 }

 document.onkeydown=e=>{
  if(e.key==="ArrowLeft")paddle-=25;
  if(e.key==="ArrowRight")paddle+=25;
  paddle=Math.max(0,Math.min(500,paddle));
 };

 function loop(){
  x.clearRect(0,0,600,400);

  x.fillStyle="#2563eb";
  x.fillRect(paddle,370,100,12);

  ball.x+=ball.dx;
  ball.y+=ball.dy;

  if(ball.x<0||ball.x>590)ball.dx*=-1;
  if(ball.y<0)ball.dy*=-1;

  if(ball.y>355&&ball.x>paddle&&ball.x<paddle+100)ball.dy*=-1;

  x.beginPath();
  x.arc(ball.x,ball.y,8,0,Math.PI*2);
  x.fill();

  blocks.forEach(b=>{
   if(!b.alive)return;

   x.fillStyle="#f59e0b";
   x.fillRect(b.x,b.y,70,20);

   if(
    ball.x>b.x&&
    ball.x<b.x+70&&
    ball.y>b.y&&
    ball.y<b.y+20
   ){
    b.alive=false;
    ball.dy*=-1;
    updateScore(5);
   }
  });

  if(ball.y>400){
   document.getElementById("gameBox").innerHTML+=
   `<div class="message">💥 GAME OVER</div>
    <button class="gameButton" onclick="restartGame()">🔄 RESTART GAME</button>`;
   return;
  }

  if(blocks.every(b=>!b.alive)){
   nextLevel();
   return;
  }

  animationID=requestAnimationFrame(loop);
 }

 animationID=requestAnimationFrame(loop);
}
