```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGames — Play. Have Fun. Repeat.</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    background:#070812;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}
body:before{
    content:"";
    position:fixed;
    width:600px;height:600px;
    border-radius:50%;
    background:rgba(100,60,255,.16);
    filter:blur(100px);
    top:-200px;left:-150px;
    animation:float 8s infinite alternate;
    pointer-events:none;
}
body:after{
    content:"";
    position:fixed;
    width:500px;height:500px;
    border-radius:50%;
    background:rgba(0,220,255,.10);
    filter:blur(100px);
    bottom:-200px;right:-150px;
    animation:float2 10s infinite alternate;
    pointer-events:none;
}
@keyframes float{to{transform:translate(180px,120px)}}
@keyframes float2{to{transform:translate(-150px,-100px)}}

header{
    padding:28px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    z-index:2;
}
.logo{
    font-size:34px;
    font-weight:900;
    letter-spacing:-2px;
}
.logo span{color:#8d6bff}
.badge{
    padding:10px 16px;
    border:1px solid #302b55;
    border-radius:30px;
    background:rgba(20,20,40,.7);
    color:#bdb6ff;
    font-size:13px;
}

.hero{
    text-align:center;
    padding:55px 20px 35px;
    position:relative;
    z-index:1;
}
.hero h1{
    font-size:clamp(55px,10vw,110px);
    font-weight:1000;
    letter-spacing:-7px;
    background:linear-gradient(90deg,#fff,#9b7cff,#54eaff,#fff);
    background-size:300%;
    -webkit-background-clip:text;
    color:transparent;
    animation:gradient 5s linear infinite;
}
@keyframes gradient{
    to{background-position:300%}
}
.hero p{
    color:#aaa8bc;
    margin:18px 0 30px;
    font-size:18px;
}

.search{
    width:min(650px,90%);
    margin:auto;
    position:relative;
}
.search input{
    width:100%;
    padding:18px 22px;
    border-radius:18px;
    border:1px solid #302b55;
    background:#111120;
    color:white;
    outline:none;
    font-size:16px;
    box-shadow:0 0 30px rgba(100,80,255,.08);
}
.search input:focus{
    border-color:#8065ff;
    box-shadow:0 0 30px rgba(100,80,255,.25);
}

.categories{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    padding:20px;
}
.cat{
    padding:10px 16px;
    border:1px solid #29263f;
    background:#11101c;
    color:#aaa;
    border-radius:30px;
    cursor:pointer;
    transition:.2s;
}
.cat:hover,.cat.active{
    background:#7560ff;
    color:white;
    border-color:#7560ff;
    transform:translateY(-2px);
}

.section{
    width:min(1250px,92%);
    margin:20px auto 70px;
    position:relative;
    z-index:1;
}
.section-title{
    font-size:25px;
    margin:30px 0 20px;
}
.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}
.card{
    background:linear-gradient(145deg,rgba(24,23,42,.95),rgba(13,13,25,.95));
    border:1px solid #282541;
    border-radius:22px;
    padding:22px;
    min-height:235px;
    display:flex;
    flex-direction:column;
    transition:.3s;
    animation:cardIn .5s ease both;
}
@keyframes cardIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}
.card:hover{
    transform:translateY(-8px) scale(1.015);
    border-color:#7863ff;
    box-shadow:0 18px 45px rgba(70,50,180,.25);
}
.icon{
    font-size:48px;
    margin-bottom:16px;
    animation:bob 3s ease-in-out infinite;
}
@keyframes bob{
    50%{transform:translateY(-5px)}
}
.card h3{font-size:20px;margin-bottom:8px}
.card p{color:#9190a0;font-size:13px;line-height:1.5;flex:1}
.play{
    border:0;
    background:linear-gradient(90deg,#765cff,#4e9dff);
    color:white;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    margin-top:18px;
    transition:.2s;
}
.play:hover{filter:brightness(1.2);transform:scale(1.03)}

#gameScreen{
    display:none;
    min-height:100vh;
    padding:25px;
    position:relative;
    z-index:5;
}
.back{
    border:1px solid #36314e;
    background:#141322;
    color:white;
    padding:11px 18px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:20px;
}
.gameBox{
    width:min(900px,100%);
    margin:auto;
    text-align:center;
}
.gameBox h2{
    font-size:38px;
    margin:15px 0 8px;
}
.gameInfo{
    color:#aaa;
    margin-bottom:18px;
}
canvas{
    background:#0d0d19;
    border:1px solid #383253;
    border-radius:18px;
    max-width:100%;
}
.controls{
    margin:15px;
    color:#999;
}
.action{
    border:0;
    background:#765cff;
    color:white;
    padding:13px 20px;
    border-radius:12px;
    cursor:pointer;
    margin:6px;
    font-weight:bold;
}
.bigNumber{
    font-size:70px;
    font-weight:900;
    margin:25px;
}
.choice{
    display:block;
    width:min(500px,90%);
    margin:10px auto;
    padding:15px;
    border:1px solid #36314e;
    background:#151424;
    color:white;
    border-radius:12px;
    cursor:pointer;
}
.choice:hover{background:#30275e}
.message{
    margin:15px;
    min-height:25px;
    color:#bdb5ff;
}

footer{
    text-align:center;
    color:#555466;
    padding:30px;
}

@media(max-width:600px){
    .hero h1{letter-spacing:-4px}
    header{padding:20px}
    .hero{padding-top:35px}
}
</style>
</head>

<body>

<header>
    <div class="logo">🎮 G<span>Games</span></div>
    <div class="badge">V1.2 • 36 GAMES</div>
</header>

<main id="home">
<section class="hero">
    <h1>GGAMES</h1>
    <p>Play. Have Fun. Repeat.</p>
    <div class="search">
        <input id="search" placeholder="🔎 Search a game..." oninput="searchGames()">
    </div>
</section>

<div class="categories">
    <button class="cat active" onclick="filterGames('All',this)">All</button>
    <button class="cat" onclick="filterGames('Sports',this)">⚽ Sports</button>
    <button class="cat" onclick="filterGames('Racing',this)">🏎️ Racing</button>
    <button class="cat" onclick="filterGames('Puzzle',this)">🧠 Puzzle</button>
    <button class="cat" onclick="filterGames('Arcade',this)">🕹️ Arcade</button>
    <button class="cat" onclick="filterGames('Quick',this)">⚡ Quick</button>
</div>

<section class="section">
    <h2 class="section-title">🔥 Trending Games</h2>
    <div class="games" id="games"></div>
</section>
</main>

<section id="gameScreen">
    <div class="gameBox">
        <button class="back" onclick="goHome()">← BACK TO GAMES</button>
        <h2 id="gameTitle"></h2>
        <div class="gameInfo" id="gameInfo"></div>
        <div id="gameArea"></div>
    </div>
</section>

<footer>🎮 GGames • Play. Have Fun. Repeat.</footer>

<script>
const games=[
["football","⚽","Football Clicker","Click as fast as you can!","Sports"],
["penalty","🥅","Penalty Shootout","Score the winning penalty.","Sports"],
["basketball","🏀","Basketball Hoops","Hit the moving hoop.","Sports"],
["cricket","🏏","Cricket Hit","Time your cricket shots.","Sports"],
["tennis","🎾","Tennis Smash","Return the ball.","Sports"],
["keeper","🧤","Football Keeper","Save the incoming shots.","Sports"],

["racing","🏎️","Racing","Avoid traffic and survive.","Racing"],
["traffic","🚗","Traffic Dodger","Dodge cars at speed.","Racing"],
["highway","🛣️","Highway Rush","Stay on the highway.","Racing"],
["drift","💨","Drift Master","Collect points while drifting.","Racing"],
["spaceDodge","🚀","Space Dodge","Avoid the asteroids.","Racing"],
["falling","🧱","Falling Blocks","Survive the falling blocks.","Racing"],

["guess","🔢","Number Guessing","Find the secret number.","Puzzle"],
["memory","🧠","Memory Match","Match the hidden pairs.","Puzzle"],
["merge","🔢","Number Merge","Merge numbers to reach 2048.","Puzzle"],
["word","🔤","Word Scramble","Unscramble the word.","Puzzle"],
["math","➗","Math Challenge","Solve as many as possible.","Puzzle"],
["reaction","⚡","Reaction Test","Test your reaction speed.","Puzzle"],
["color","🌈","Color Match","Find the correct color.","Puzzle"],
["pattern","🟦","Pattern Memory","Remember the pattern.","Puzzle"],

["snake","🐍","Snake","Eat food and grow.","Arcade"],
["breakout","🧱","Breakout","Destroy every block.","Arcade"],
["flyer","🐦","Sky Flyer","Fly through the gaps.","Arcade"],
["jumper","🦘","Endless Jumper","Jump and survive.","Arcade"],
["coins","🪙","Coin Collector","Collect as many coins as possible.","Arcade"],
["bubble","🫧","Bubble Pop","Pop the bubbles.","Arcade"],
["shooter","🚀","Space Shooter","Shoot incoming enemies.","Arcade"],
["maze","🌀","Maze Escape","Find your way out.","Arcade"],
["target","🎯","Tap the Target","Hit targets quickly.","Arcade"],
["stack","🏗️","Stack Tower","Build the tallest tower.","Arcade"],

["rps","✊","Rock Paper Scissors","Challenge the computer.","Quick"],
["ttt","❌⭕","Tic-Tac-Toe","Classic X and O.","Quick"],
["mole","🐹","Whack-a-Mole","Hit the mole.","Quick"],
["stars","⭐","Catch the Stars","Catch falling stars.","Quick"],
["meteor","☄️","Meteor Dodge","Dodge the meteors.","Quick"],
["typing","⌨️","Typing Speed","Type the words quickly.","Quick"]
];

let currentFilter="All";

function renderGames(list=games){
    const box=document.getElementById("games");
    box.innerHTML="";
    list.forEach((g,i)=>{
        box.innerHTML+=`
        <div class="card" style="animation-delay:${i*0.025}s">
            <div class="icon">${g[1]}</div>
            <h3>${g[2]}</h3>
            <p>${g[3]}</p>
            <button class="play" onclick="openGame('${g[0]}')">PLAY NOW →</button>
        </div>`;
    });
}
renderGames();

function filterGames(category,btn){
    currentFilter=category;
    document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    const list=category==="All"?games:games.filter(g=>g[4]===category);
    renderGames(list);
}

function searchGames(){
    const q=document.getElementById("search").value.toLowerCase();
    const list=games.filter(g=>
        (currentFilter==="All"||g[4]===currentFilter) &&
        (g[2].toLowerCase().includes(q)||g[3].toLowerCase().includes(q))
    );
    renderGames(list);
}

let animationID=null;
let keys={};

document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function openGame(id){
    document.getElementById("home").style.display="none";
    document.querySelector("header").style.display="none";
    document.querySelector("footer").style.display="none";
    document.getElementById("gameScreen").style.display="block";
    const g=games.find(x=>x[0]===id);
    document.getElementById("gameTitle").textContent=g[1]+" "+g[2];
    document.getElementById("gameInfo").textContent=g[3];
    document.getElementById("gameArea").innerHTML="";
    if(animationID)cancelAnimationFrame(animationID);
    window.scrollTo(0,0);
    startGame(id);
}

function goHome(){
    if(animationID)cancelAnimationFrame(animationID);
    document.getElementById("gameScreen").style.display="none";
    document.getElementById("home").style.display="block";
    document.querySelector("header").style.display="flex";
    document.querySelector("footer").style.display="block";
    document.getElementById("gameArea").innerHTML="";
    window.scrollTo(0,0);
}

function canvasGame(width=700,height=430){
    const c=document.createElement("canvas");
    c.width=width;c.height=height;
    document.getElementById("gameArea").appendChild(c);
    return c;
}

function button(text,fn){
    const b=document.createElement("button");
    b.className="action";b.textContent=text;b.onclick=fn;
    document.getElementById("gameArea").appendChild(b);
    return b;
}

function msg(text){
    const d=document.createElement("div");
    d.className="message";d.textContent=text;
    document.getElementById("gameArea").appendChild(d);
    return d;
}

function startGame(id){
switch(id){

/* 1 FOOTBALL CLICKER */
case"football":{
    let score=0;
    document.getElementById("gameArea").innerHTML=
    `<div class="bigNumber" id="score">0</div>
     <button class="action" id="kick">⚽ KICK!</button>
     <div class="message" id="goal">Click the ball!</div>`;
    document.getElementById("kick").onclick=()=>{
        score++;
        document.getElementById("score").textContent=score;
        document.getElementById("goal").textContent=
        score%10===0?"🔥 SIUUUUUU! GOAL!":"GOAL! ⚽";
    };
break}

/* 2 PENALTY */
case"penalty":{
    const c=canvasGame(),x=c.getContext("2d");
    let ball={x:350,y:350},target=Math.random()*560+70,score=0,playing=true;
    function draw(){
        x.clearRect(0,0,700,430);
        x.fillStyle="#164b28";x.fillRect(0,0,700,430);
        x.strokeStyle="white";x.strokeRect(90,40,520,320);
        x.fillStyle="#eee";x.fillRect(target-35,55,70,10);
        x.font="50px Arial";x.fillText("⚽",ball.x-25,ball.y);
        x.font="22px Arial";x.fillText("Score: "+score,20,30);
        if(playing)animationID=requestAnimationFrame(draw);
    }
    c.onclick=e=>{
        if(!playing)return;
        ball.x=e.offsetX;ball.y=70;
        if(Math.abs(ball.x-target)<40){score++;msg("GOAL! 🔥 Score: "+score)}
        else msg("SAVED! 🧤");
        target=Math.random()*560+70;
    };
    draw();button("RESTART",()=>openGame("penalty"));
break}

/* 3 BASKETBALL */
case"basketball":{
    const c=canvasGame(),x=c.getContext("2d");
    let score=0,px=100,dir=1;
    c.onclick=e=>{
        if(Math.abs(e.offsetX-px)<55){score++;msg("🏀 HOOP! Score: "+score)}
        else msg("Miss!");
    };
    function draw(){
        x.clearRect(0,0,700,430);
        x.fillStyle="#222";x.fillRect(0,0,700,430);
        x.fillStyle="#ff6b35";x.beginPath();x.arc(px,100,35,0,7);x.fill();
        x.font="60px Arial";x.fillText("🏀",330,330);
        x.font="22px Arial";x.fillStyle="white";x.fillText("Click the moving hoop!",240,40);
        px+=dir*3;if(px>620||px<80)dir*=-1;
        animationID=requestAnimationFrame(draw);
    }draw();
break}

/* 4 CRICKET */
case"cricket":{
    const c=canvasGame(),x=c.getContext("2d");
    let score=0;
    c.onclick=e=>{
        if(e.offsetX>280&&e.offsetX<420){score+=6;msg("🏏 SIX! Score: "+score)}
        else{score+=1;msg("RUN! Score: "+score)}
    };
    x.font="90px Arial";x.fillText("🏏",300,260);
    x.font="24px Arial";x.fillText("Click near the bat to hit!",230,80);
break}

/* 5 TENNIS */
case"tennis":{
    const c=canvasGame(),x=c.getContext("2d");
    let score=0,ball={x:100,y:200,dx:4,dy:2},paddle=180;
    function draw(){
        x.clearRect(0,0,700,430);
        x.fillStyle="#123b25";x.fillRect(0,0,700,430);
        x.fillStyle="white";x.fillRect(650,paddle,12,100);
        x.font="35px Arial";x.fillText("🎾",ball.x,ball.y);
        ball.x+=ball.dx;ball.y+=ball.dy;
        if(ball.y<20||ball.y>400)ball.dy*=-1;
        if(ball.x>620&&ball.y>paddle-20&&ball.y<paddle+120){ball.dx*=-1;score++; }
        if(ball.x>700){ball={x:100,y:200,dx:4,dy:2};}
        x.font="22px Arial";x.fillText("Score: "+score,20,30);
        animationID=requestAnimationFrame(draw);
    }
    document.onmousemove=e=>paddle=Math.max(0,Math.min(320,e.clientY-120));
    draw();
break}

/* 6 KEEPER */
case"keeper":{
    const c=canvasGame(),x=c.getContext("2d");
    let score=0,ball={x:Math.random()*600+50,y:50};
    c.onclick=e=>{
        if(Math.abs(e.offsetX-ball.x)<60){score++;msg("🧤 SAVE! "+score)}
        else msg("GOAL! ⚽");
        ball={x:Math.random()*600+50,y:50};
    };
    function draw(){
        x.clearRect(0,0,700,430);
        x.fillStyle="#164b28";x.fillRect(0,0,700,430);
        x.font="45px Arial";x.fillText("🥅",280,120);
        x.font="35px Arial";x.fillText("⚽",ball.x,ball.y+=2);
        x.font="22px Arial";x.fillText("Score: "+score,20,30);
        if(ball.y<430)animationID=requestAnimationFrame(draw);
        else ball={x:Math.random()*600+50,y:50},draw();
    }draw();
break}

/* 7 RACING */
case"racing":
case"traffic":
case"highway":
case"drift":{
    const c=canvasGame(),x=c.getContext("2d");
    let car=350,score=0,obs=[];
    function reset(){obs=[];score=0;car=350}
    function draw(){
        x.clearRect(0,0,700,430);
        x.fillStyle="#333";x.fillRect(150,0,400,430);
        x.fillStyle="#ddd";for(let y=0;y<430;y+=60)x.fillRect(345,y,10,30);
        if(keys.arrowleft||keys.a)car-=6;
        if(keys.arrowright||keys.d)car+=6;
        car=Math.max(180,Math.min(500,car));
        if(Math.random()<.035)obs.push({x:180+Math.random()*300,y:-40});
        obs.forEach(o=>o.y+=5);
        obs=obs.filter(o=>o.y<460);
        x.font="45px Arial";x.fillText("🏎️",car-23,380);
        x.font="40px Arial";
        obs.forEach(o=>x.fillText("🚗",o.x-20,o.y));
        obs.forEach(o=>{
            if(Math.abs(o.x-car)<45&&Math.abs(o.y-380)<45){
                msg("💥 CRASH! Score: "+score);
                reset();
            }
        });
        score++;
        x.font="22px Arial";x.fillText("Score: "+Math.floor(score/10),20,30);
        animationID=requestAnimationFrame(draw);
    }draw();
break}

/* 11 SPACE DODGE */
case"spaceDodge":
case"meteor":{
    const c=canvasGame(),x=c.getContext("2d");
    let px=350,score=0,rocks=[];
    function draw(){
        x.fillStyle="#050512";x.fillRect(0,0,700,430);
        if(keys.arrowleft||keys.a)px-=6;
        if(keys.arrowright||keys.d)px+=6;
        px=Math.max(20,Math.min(680,px));
        if(Math.random()<.04)rocks.push({x:Math.random()*700,y:-20});
        rocks.forEach(r=>r.y+=5);
        x.font="38px Arial";x.fillText("🚀",px-20,390);
        x.font="30px Arial";rocks.forEach(r=>x.fillText("☄️",r.x,r.y));
        rocks.forEach(r=>{
            if(Math.abs(r.x-px)<35&&Math.abs(r.y-390)<35){
                msg("💥 GAME OVER! Score: "+Math.floor(score/10));
                rocks=[];
            }
        });
        score++;
        animationID=requestAnimationFrame(draw);
    }draw();
break}

/* 12 FALLING BLOCKS */
case"falling":{
    const c=canvasGame(),x=c.getContext("2d");
    let px=330,blocks=[],score=0;
    function draw(){
        x.clearRect(0,0,700,430);
        if(keys.arrowleft)px-=5;if(keys.arrowright)px+=5;
        if(Math.random()<.035)blocks.push({x:Math.random()*660,y:-20});
        blocks.forEach(b=>b.y+=4);
        x.fillStyle="#785cff";x.fillRect(px,380,50,30);
        x.fillStyle="#ff5577";blocks.forEach(b=>x.fillRect(b.x,b.y,35,35));
        blocks.forEach(b=>{if(Math.abs(b.x-px)<40&&Math.abs(b.y-380)<35){blocks=[];msg("💥 Hit!");}});
        score++;x.fillStyle="white";x.font="20px Arial";x.fillText("Score: "+Math.floor(score/10),20,30);
        animationID=requestAnimationFrame(draw);
    }draw();
break}

/* 13 GUESS */
case"guess":{
    let n=Math.floor(Math.random()*100)+1,tries=0;
    document.getElementById("gameArea").innerHTML=
    `<input id="guessInput" type="number" placeholder="1-100" style="padding:15px;border-radius:10px;background:#151424;color:white;border:1px solid #444">
     <button class="action" onclick="guessNumber()">GUESS</button>
     <div class="message" id="guessMsg">Find the number!</div>`;
    window.guessNumber=()=>{
        const v=Number(document.getElementById("guessInput").value);tries++;
        document.getElementById("guessMsg").textContent=
        v===n?"🎉 CORRECT! Attempts: "+tries:v<n?"⬆️ Too low!":"⬇️ Too high!";
    };
break}

/* 14 MEMORY */
case"memory":{
    let vals=["🍎","🍎","🍌","🍌","⭐","⭐","🚀","🚀"].sort(()=>Math.random()-.5);
    let open=[],matched=0;
    document.getElementById("gameArea").innerHTML=`<div id="mem" style="display:grid;grid-template-columns:repeat(4,90px);gap:10px;justify-content:center"></div>`;
    vals.forEach((v,i)=>{
        const b=document.createElement("button");b.className="choice";b.style.height="80px";b.textContent="❓";
        b.onclick=()=>{
            if(open.length>=2||b.dataset.done)return;
            b.textContent=v;open.push([b,v]);
            if(open.length===2){
                if(open[0][1]===open[1][1]){open.forEach(a=>a[0].dataset.done="1");matched+=2;open=[];if(matched===vals.length)msg("🏆 YOU WON!");}
                else setTimeout(()=>{open.forEach(a=>a[0].textContent="❓");open=[]},600);
            }
        };
        document.getElementById("mem").appendChild(b);
    });
break}

/* 15 MERGE */
case"merge":{
    let score=0;
    document.getElementById("gameArea").innerHTML=
    `<div class="bigNumber" id="mergeN">2</div>
     <button class="action" onclick="mergeGame()">MERGE</button>

case"snake":{
    const c=canvasGame(600,400),x=c.getContext("2d");
    let snake=[{x:300,y:200}],food={x:100,y:100},dx=20,dy=0,score=0;
    document.onkeydown=e=>{
        if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-20}
        if(e.key==="ArrowDown"&&dy===0){dx=0;dy=20}
        if(e.key==="ArrowLeft"&&dx===0){dx=-20;dy=0}
        if(e.key==="ArrowRight"&&dx===0){dx=20;dy=0}
    };
    function draw(){
        x.fillStyle="#090914";x.fillRect(0,0,600,400);
        let h={x:snake[0].x+dx,y:snake[0].y+dy};
        if(h.x<0||h.x>=600||h.y<0||h.y>=400||snake.some(s=>s.x===h.x&&s.y===h.y)){
            msg("🐍 GAME OVER! Score: "+score);return;
        }
        snake.unshift(h);
        if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*30)*20,y:Math.floor(Math.random()*20)*20}}
        else snake.pop();
        x.fillStyle="#6cff7a";snake.forEach(s=>x.fillRect(s.x,s.y,18,18));

case"breakout":{

    for(let r=0;r<4;r++)for(let j=0;j<9;j++)blocks.push({x:45+j*70,y:50+r*25});
    function draw(){
        x.clearRect(0,0,700,430);
        if(keys.arrowleft)px-=7;if(keys.arrowright)px+=7;
        px=Math.max(0,Math.min(620,px));

        x.font="20px Arial";blocks.forEach(b=>x.fillText("🧱",b.x,b.y));
        x.font="25px Arial";x.fillText("⚪",ball.x,ball.y);
        ball.x+=ball.dx;ball.y+=ball.dy;
        if(ball.x<0||ball.x>680)ball.dx*=-1;if(ball.y<0)ball.dy*=-1;
        if(ball.y>370&&ball.x>px&&ball.x<px+80)ball.dy=-Math.abs(ball.dy);
        blocks=blocks.filter(b=>{
            if(Math.abs(ball.x-b.x)<25&&Math.abs(ball.y-b.y)<20){ball.dy*=-1;return false}
            return true;
        });
        if(ball.y>430){msg("💥 GAME OVER!");return}
        if(blocks.length===0){msg("🏆 YOU WIN!");return}
        animationID=requestAnimationFrame(draw);
    }draw();
break}
