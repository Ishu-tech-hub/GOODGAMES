<script>

const games=[

["ttt","❌⭕","Tic-Tac-Toe","Classic X and O.","Quick"],

["stars","⭐","Catch the Stars","Catch falling stars.","Quick"],
["meteor","☄️","Meteor Dodge","Dodge the meteors.","Quick"],
["typing","⌨️","Typing Speed","Type the words quickly.","Quick"],

["topanswer","🔎","Guess the Top Answer","Guess the popular answer to the question.","Quick"]

];

let currentFilter="All";
let currentGame="";
let level=1;
let score=0;
let timer=60;
let timerID=null;
let gameOver=false;
let animationID=null;
let keys={};

document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

function renderGames(list=games){

const box=document.getElementById("games");

box.innerHTML="";

list.forEach((g,i)=>{

box.innerHTML+=`

<div class="card" style="animation-delay:${i*0.025}s">

<div class="icon">${g[1]}</div>

<h3>${g[2]}</h3>

<p>${g[3]}</p>

<button class="play" onclick="openGame('${g[0]}')">
PLAY NOW →
</button>

</div>

`;

});

}

renderGames();

function filterGames(category,btn){

currentFilter=category;

document.querySelectorAll(".cat")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

const list=category==="All"
?games
:games.filter(g=>g[4]===category);

renderGames(list);

}

function searchGames(){

const q=document.getElementById("search").value.toLowerCase();

const list=games.filter(g=>
(currentFilter==="All"||g[4]===currentFilter)&&
(g[2].toLowerCase().includes(q)||
g[3].toLowerCase().includes(q))
);

renderGames(list);

}

function updateStats(){

document.getElementById("levelDisplay").textContent=
"LEVEL "+level;

document.getElementById("timerDisplay").textContent=
"⏱️ "+timer;

document.getElementById("scoreDisplay").textContent=
"🏆 "+score;

if(timer<=10)
document.getElementById("timerDisplay").classList.add("timerDanger");
else
document.getElementById("timerDisplay").classList.remove("timerDanger");

}

function startTimer(seconds=60){

clearInterval(timerID);

timer=seconds;

updateStats();

timerID=setInterval(()=>{

if(gameOver)return;

timer--;

updateStats();

if(timer<=0){

gameOver=true;

clearInterval(timerID);

msg("⏰ TIME UP! Score: "+score);

}

},1000);

}

function stopEverything(){

clearInterval(timerID);

if(animationID)
cancelAnimationFrame(animationID);

animationID=null;

gameOver=true;

}

function openGame(id){

stopEverything();

currentGame=id;

level=1;
score=0;
gameOver=false;

document.getElementById("home").style.display="none";

document.querySelector("header").style.display="none";

document.querySelector("footer").style.display="none";

document.getElementById("gameScreen").style.display="block";

const g=games.find(x=>x[0]===id);

document.getElementById("gameTitle").textContent=
g[1]+" "+g[2];

document.getElementById("gameInfo").textContent=
g[3];

document.getElementById("gameArea").innerHTML="";

updateStats();

window.scrollTo(0,0);

startGame(id);

}

function restartGame(){

openGame(currentGame);

}

function goHome(){

stopEverything();

document.getElementById("gameScreen").style.display="none";

document.getElementById("home").style.display="block";

document.querySelector("header").style.display="flex";

document.querySelector("footer").style.display="block";

document.getElementById("gameArea").innerHTML="";

window.scrollTo(0,0);

}

function canvasGame(width=700,height=430){

const c=document.createElement("canvas");

c.width=width;
c.height=height;

document.getElementById("gameArea").appendChild(c);

return c;

}

function button(text,fn,extra=""){

const b=document.createElement("button");

b.className="action "+extra;

b.textContent=text;

b.onclick=fn;

document.getElementById("gameArea").appendChild(b);

return b;

}

function restartButton(){

button("🔄 RESTART GAME",restartGame,"restart");

}

function msg(text){

const d=document.getElementById("gameMessage");

if(d)
d.textContent=text;
else{

const n=document.createElement("div");

n.id="gameMessage";
n.className="message";

n.textContent=text;

document.getElementById("gameArea").appendChild(n);

}

}

/* LEVEL SYSTEM */

function nextLevel(){

level++;

if(level>10){

gameOver=true;

clearInterval(timerID);

msg("🏆 LEVEL 10 COMPLETE! YOU BEAT THE GAME!");

return false;

}

timer=Math.max(12,60-(level-1)*4);

updateStats();

return true;

}

/* START GAME */

function startGame(id){

switch(id){

/* FOOTBALL MASTER */

case"football":{

const c=canvasGame();

const x=c.getContext("2d");

let ballX=350;

let keeperX=350;

let direction=1;

let shots=0;

c.onclick=e=>{

if(gameOver)return;

shots++;

if(Math.abs(e.offsetX-keeperX)>55){

score+=10;

msg("⚽ GOAL! +10");

}else{

msg("🧤 SAVED!");

}

updateStats();

if(shots>=5){

if(nextLevel()){

shots=0;

msg("🔥 LEVEL "+level+" — goalkeeper is faster!");

}

}

};

function draw(){

x.clearRect(0,0,700,430);

x.fillStyle="#124c29";

x.fillRect(0,0,700,430);

x.strokeStyle="white";

x.lineWidth=4;

x.strokeRect(120,40,460,260);

x.fillStyle="white";

x.fillRect(keeperX-45,90,90,12);

x.font="60px Arial";

x.fillText("🧤",keeperX-30,155);

x.font="55px Arial";

x.fillText("⚽",ballX-27,350);

keeperX+=direction*(2+level*.6);

if(keeperX>530||keeperX<170)
direction*=-1;

animationID=requestAnimationFrame(draw);

}

draw();

msg("Click where you want to shoot!");

restartButton();

break;

}

/* PENALTY */

case"penalty":{

const c=canvasGame();

const x=c.getContext("2d");

let target=350;

let attempts=0;

c.onclick=e=>{

if(gameOver)return;

attempts++;

if(Math.abs(e.offsetX-target)<55){

score+=10;

msg("🔥 GOAL! +10");

}else{

msg("🧤 SAVED!");

}

updateStats();

target=70+Math.random()*560;

if(attempts>=5){

attempts=0;

nextLevel();

}

};

function draw(){

x.clearRect(0,0,700,430);

x.fillStyle="#164b28";

x.fillRect(0,0,700,430);

x.strokeStyle="white";

x.strokeRect(100,40,500,300);

x.font="55px Arial";

x.fillText("🥅",target-27,120);

x.font="55px Arial";

x.fillText("⚽",320,350);

x.font="20px Arial";

x.fillText("LEVEL "+level,20,30);

animationID=requestAnimationFrame(draw);

}

draw();

restartButton();

break;

}

/* BASKETBALL */

case"basketball":{

const c=canvasGame();

const x=c.getContext("2d");

let hoop=100;

let dir=1;

function draw(){

x.clearRect(0,0,700,430);

x.fillStyle="#202020";

x.fillRect(0,0,700,430);

x.fillStyle="#ff6333";

x.beginPath();

x.arc(hoop,100,35,0,Math.PI*2);

x.fill();

x.font="70px Arial";

x.fillText("🏀",320,340);

hoop+=dir*(2+level*.5);

if(hoop>620||hoop<80)dir*=-1;

animationID=requestAnimationFrame(draw);

}

c.onclick=e=>{

if(Math.abs(e.offsetX-hoop)<55){

score+=10;

msg("🏀 HOOP!");

if(score>=level*30){

if(nextLevel())msg("🔥 LEVEL "+level);

}

}else msg("MISS!");

updateStats();

};

draw();

restartButton();

break;

}

/* CRICKET */

case"cricket":{

const c=canvasGame();

const x=c.getContext("2d");

let target=350;

let hits=0;

c.onclick=e=>{

if(gameOver)return;

if(Math.abs(e.offsetX-target)<70){

score+=6;

msg("🏏 SIX!");

hits++;

}else msg("MISS!");

updateStats();

target=80+Math.random()*540;

if(hits>=5){

hits=0;

nextLevel();

}

};

function draw(){

x.clearRect(0,0,700,430);

x.fillStyle="#174c28";

x.fillRect(0,0,700,430);

x.font="90px Arial";

x.fillText("🏏",300,280);

x.font="25px Arial";

x.fillText("Target: "+Math.round(target),270,60);

animationID=requestAnimationFrame(draw);

}

draw();

restartButton();

break;

}

/* TENNIS */

case"tennis":{

const c=canvasGame();

const x=c.getContext("2d");

let ball={x:100,y:200,dx:4+level,dy:2};

let paddle=180;

function draw(){

x.clearRect(0,0,700,430);

x.fillStyle="#124126";

x.fillRect(0,0,700,430);

x.fillStyle="white";

x.fillRect(650,paddle,12,100);

x.font="40px Arial";

x.fillText("🎾",ball.x,ball.y);

ball.x+=ball.dx;

ball.y+=ball.dy;

if(ball.y<20||ball.y>400)
ball.dy*=-1;

if(ball.x>620&&ball.y>paddle-20&&ball.y<paddle+120){

ball.dx=-Math.abs(ball.dx);

score++;

if(score%10===0)nextLevel();

updateStats();

}

if(ball.x>700){

ball={x:100,y:200,dx:4+level,dy:2};

}

animationID=requestAnimationFrame(draw);

}

document.onmousemove=e=>{

paddle=Math.max(0,Math.min(320,e.clientY-120));

};

draw();

restartButton();

break;

}

/* KEEPER */

case"keeper":{

const c=canvasGame();

const x=c.getContext("2d");

let ballX=350;

let ballY=40;

let saves=0;

c.onclick=e=>{

if(Math.abs(e.offsetX-ballX)<60){

score+=10;

saves++;

msg("🧤 SAVE!");

}else msg("⚽ GOAL!");

updateStats();

ballX=60+Math.random()*580;

ballY=40;

if(saves>=5){

saves=0;

nextLevel();

}

};

function draw(){

x.clearRect(0,0,700,430);

x.fillStyle="#164b28";

x.fillRect(0,0,700,430);

x.font="60px Arial";

x.fillText("🥅",300,110);

x.font="40px Arial";

x.fillText("⚽",ballX,ballY);

ballY+=2+level*.5;

if(ballY>430){

ballY=40;

ballX=60+Math.random()*580;

}

animationID=requestAnimationFrame(draw);

}

draw();

restartButton();

break;

}

let chosen=[];

function newRound(){

chosen=[];

document.getElementById("gameArea").innerHTML=`
